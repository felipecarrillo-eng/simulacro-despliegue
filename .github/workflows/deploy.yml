name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/vulnerabilidades

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: pip install pytest

      - name: Ejecutar pruebas
        run: python -m pytest test_app.py


  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Analizar código
        run: bandit sample_app.py -ll


  trivy:
    name: Seguridad - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "felipe3814/proyecto-mysql-app-backend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "HIGH,CRITICAL"


  build-and-deploy:
    name: Build and Deploy
    needs:
      - test
      - bandit
      - trivy

    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Build completado correctamente"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy en AWS
        run: |
          ssh -i ~/.ssh/aws_key \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            'cd ~/simulacro-despliegue && docker compose pull app-backend && docker compose up -d app-backend'

      - name: Verificar despliegue
        run: |
          echo "Despliegue completado correctamente"
