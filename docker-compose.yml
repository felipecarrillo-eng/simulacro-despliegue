services:
  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adso_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba

  app-backend:
    image: felipe3814/proyecto-mysql-app-backend:latest
    container_name: app-backend
    restart: always
    ports:
      - "5050:5050"
    depends_on:
      - servidor-bd
    networks:
      - red-cba

volumes:
  mysql-data:

networks:
  red-cba:
